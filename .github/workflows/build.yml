name: Build and publish

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  VERSION: 10.0.0.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.VERSION }}
            ghcr.io/${{ github.repository }}:latest

      # The Dockerfile already fails the build if the patch does not apply.
      # This step independently confirms the pushed image carries the patch.
      - name: Verify Mobile Edit patch in built image
        run: |
          docker run --rm --entrypoint /bin/sh "ghcr.io/${{ github.repository }}:${{ env.VERSION }}" -c '
            set -e
            for f in /var/www/onlyoffice/documentserver/web-apps/apps/*/mobile/dist/js/app.js; do
              if grep -qE "isSupportEditFeature=\(\)=>(1|\{return 1\})|isSupportEditFeature=function\(\)\{return 1\}" "$f"; then
                echo "OK: $f"
              else
                echo "PATCH MISSING in $f"
                exit 1
              fi
            done'
